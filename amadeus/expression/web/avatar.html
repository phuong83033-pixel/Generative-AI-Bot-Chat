<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Amadeus</title>
<style>
  :root {
    --bg-top: #1d2140;
    --bg-bottom: #3a2745;
    --text: #e9e6f5;
    --muted: #9a96b8;
    --skin: #ffe3d2;
    --skin-shade: #f3c9b4;
    --hair: #7d2f2c;
    --hair-light: #a8483f;
    --eye: #5a6bd6;
    --ink: #3a1f1f;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    overflow: hidden;
  }
  svg { width: min(92vw, 62vh); height: auto; max-height: 86vh; filter: drop-shadow(0 18px 40px rgba(0,0,0,.35)); }
  .caption { margin-top: 10px; min-height: 3.2em; text-align: center; line-height: 1.5; }
  .mood { font-size: 1.15rem; font-weight: 600; letter-spacing: .02em; }
  .meta { font-size: .85rem; color: var(--muted); }
  .conn { position: fixed; top: 12px; right: 14px; font-size: .8rem; color: var(--muted); }
  .conn::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%;
                  background: #e0556b; margin-right: 6px; }
  .conn.live::before { background: #4fd08a; }
  #raw { position: fixed; left: 12px; top: 12px; font: 11px/1.4 ui-monospace, Consolas, monospace;
         color: var(--muted); white-space: pre; display: none; }
  body.debug #raw { display: block; }
</style>
</head>
<body>
<div class="conn" id="conn">connecting</div>
<pre id="raw"></pre>

<svg viewBox="0 0 400 470" role="img" aria-label="Amadeus avatar">
  <defs>
    <linearGradient id="iris" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7c8cf0"/><stop offset="1" stop-color="#3b3fa8"/>
    </linearGradient>
    <clipPath id="clipL"><ellipse cx="0" cy="0" rx="25" ry="21"/></clipPath>
    <clipPath id="clipR"><ellipse cx="0" cy="0" rx="25" ry="21"/></clipPath>
  </defs>

  <g id="headBack">
    <!-- hair behind -->
    <path d="M60 230 C48 120 120 52 200 52 C280 52 352 120 340 230 C346 330 318 400 300 440
             L282 400 L118 400 L100 440 C82 400 54 330 60 230 Z" fill="var(--hair)"/>
  </g>

  <!-- clothes (static) -->
  <path d="M40 470 C50 395 110 372 200 372 C290 372 350 395 360 470 Z" fill="#f4f1ee"/>
  <path d="M170 372 L200 410 L230 372 Z" fill="var(--skin-shade)"/>
  <path d="M188 395 L212 395 L219 470 L181 470 Z" fill="#b8323f"/>

  <g id="head">
    <!-- neck -->
    <rect x="172" y="318" width="56" height="64" rx="18" fill="var(--skin-shade)"/>
    <!-- face -->
    <path d="M100 215 C100 120 148 84 200 84 C252 84 300 120 300 215
             C300 292 256 346 200 346 C144 346 100 292 100 215 Z" fill="var(--skin)"/>
    <!-- blush -->
    <ellipse id="blushL" cx="140" cy="285" rx="26" ry="14" fill="#ff7f8f" opacity="0"/>
    <ellipse id="blushR" cx="260" cy="285" rx="26" ry="14" fill="#ff7f8f" opacity="0"/>

    <!-- eyes -->
    <g transform="translate(152 232)"><g id="eyeL">
      <g clip-path="url(#clipL)">
        <ellipse cx="0" cy="0" rx="25" ry="21" fill="#fff"/>
        <g id="irisL"><circle cx="0" cy="0" r="15" fill="url(#iris)"/><circle cx="0" cy="0" r="7" fill="#1c1a45"/>
          <circle cx="-5" cy="-6" r="4" fill="#fff" opacity=".9"/></g>
      </g>
      <path d="M-27 -2 Q0 -26 27 -2" fill="none" stroke="var(--ink)" stroke-width="5" stroke-linecap="round"/>
    </g></g>
    <g transform="translate(248 232)"><g id="eyeR">
      <g clip-path="url(#clipR)">
        <ellipse cx="0" cy="0" rx="25" ry="21" fill="#fff"/>
        <g id="irisR"><circle cx="0" cy="0" r="15" fill="url(#iris)"/><circle cx="0" cy="0" r="7" fill="#1c1a45"/>
          <circle cx="-5" cy="-6" r="4" fill="#fff" opacity=".9"/></g>
      </g>
      <path d="M-27 -2 Q0 -26 27 -2" fill="none" stroke="var(--ink)" stroke-width="5" stroke-linecap="round"/>
    </g></g>

    <!-- brows -->
    <g transform="translate(152 190)"><g id="browL"><path d="M-24 2 Q0 -8 24 2" fill="none" stroke="var(--hair)" stroke-width="6" stroke-linecap="round"/></g></g>
    <g transform="translate(248 190)"><g id="browR"><path d="M-24 2 Q0 -8 24 2" fill="none" stroke="var(--hair)" stroke-width="6" stroke-linecap="round"/></g></g>

    <!-- nose -->
    <path d="M196 262 Q200 270 206 264" fill="none" stroke="var(--skin-shade)" stroke-width="3" stroke-linecap="round"/>

    <!-- mouth -->
    <path id="mouth" d="M178 312 Q200 312 222 312 Q200 312 178 312 Z" fill="none" stroke="#9a4a4f" stroke-width="3.5"
          stroke-linejoin="round" stroke-linecap="round"/>

    <!-- bangs -->
    <path d="M96 200 C86 120 140 70 200 70 C262 70 316 120 304 200 C292 160 262 128 236 124
             C226 150 196 168 164 150 C146 160 120 176 96 200 Z" fill="var(--hair)"/>
    <path d="M150 100 C170 86 200 82 222 90" fill="none" stroke="var(--hair-light)" stroke-width="5" stroke-linecap="round" opacity=".7"/>
  </g>
</svg>

<div class="caption">
  <div class="mood" id="mood">waiting for Amadeus ...</div>
  <div class="meta" id="meta">&nbsp;</div>
</div>

<script>
  const $ = (id) => document.getElementById(id);
  const clamp = (x, lo, hi) => Math.min(hi, Math.max(lo, x));
  if (location.search.includes("debug")) document.body.classList.add("debug");

  // The newest frame from the server. Drawing happens on animation frames, not on messages,
  // so a burst of messages costs one redraw and the display stays in step with the screen.
  let frame = null;

  function draw(f) {
    // Head: roll, plus a little yaw/pitch as translation (a flat drawing cannot truly turn).
    const headT = `translate(${(f.head_yaw * 1.3).toFixed(2)} ${(-f.head_pitch * 1.1).toFixed(2)}) rotate(${(-f.head_roll).toFixed(2)} 200 330)`;
    $("head").setAttribute("transform", headT);
    $("headBack").setAttribute("transform", headT);

    // Eyes: 0.85 is the resting openness, so scale relative to it.
    const open = clamp(f.eye_open / 0.85, 0.04, 1.2);
    for (const side of ["L", "R"]) {
      $("eye" + side).setAttribute("transform", `scale(1 ${open.toFixed(3)})`);
      $("iris" + side).setAttribute("transform",
        `translate(${(f.gaze_x * 11).toFixed(2)} ${(-f.gaze_y * 8).toFixed(2)})`);
    }

    // Brows: raise moves them up; brow_inner < 0 (angry) tilts the INNER ends down, > 0 (worried) up.
    const lift = -f.brow_raise * 10, tilt = -f.brow_inner * 15;
    $("browL").setAttribute("transform", `translate(0 ${lift.toFixed(2)}) rotate(${tilt.toFixed(2)})`);
    $("browR").setAttribute("transform", `translate(0 ${lift.toFixed(2)}) rotate(${(-tilt).toFixed(2)})`);

    $("blushL").setAttribute("opacity", (f.blush * 0.8).toFixed(3));
    $("blushR").setAttribute("opacity", (f.blush * 0.8).toFixed(3));

    // Mouth: corners rise with a smile; the lower lip drops with openness.
    const cx = 200, cy = 314, hw = 20 + 5 * Math.abs(f.mouth_smile) + 4 * f.mouth_open;
    const yc = cy - f.mouth_smile * 8;
    const upper = cy - 3 - f.mouth_smile * 2 - f.mouth_open * 2;
    const lower = cy + 3 + Math.max(0, f.mouth_smile) * 9 + f.mouth_open * 34;
    $("mouth").setAttribute("d",
      `M${cx - hw} ${yc} Q${cx} ${upper} ${cx + hw} ${yc} Q${cx} ${lower} ${cx - hw} ${yc} Z`);
    $("mouth").setAttribute("fill", f.mouth_open > 0.06 ? "#7a2b3a" : "none");

    $("mood").textContent = f.label;
    $("meta").textContent = f.state.toLowerCase();
    if (document.body.classList.contains("debug")) {
      $("raw").textContent = Object.entries(f).map(([k, v]) => `${k.padEnd(12)} ${typeof v === "number" ? v.toFixed(3) : v}`).join("\n");
    }
  }

  function loop() {
    if (frame) draw(frame);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  function connect() {
    const ws = new WebSocket(`ws://${location.host}/ws`);
    ws.onopen = () => { $("conn").textContent = "live"; $("conn").className = "conn live"; };
    ws.onmessage = (e) => { frame = JSON.parse(e.data); };
    ws.onclose = () => {
      $("conn").textContent = "reconnecting"; $("conn").className = "conn";
      setTimeout(connect, 1000);
    };
  }
  connect();
</script>
</body>
</html>
