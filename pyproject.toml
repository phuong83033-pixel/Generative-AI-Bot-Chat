[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "amadeus-ai"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "sounddevice",
    "numpy",
    "pyyaml",
    "python-dotenv"
]

[project.optional-dependencies]
stt = ["faster-whisper"]
llm = ["llama-cpp-python"]
tts = ["edge-tts"]
dev = ["pytest", "pytest-asyncio"]
all = ["faster-whisper", "llama-cpp-python", "edge-tts", "pytest", "pytest-asyncio"]

[project.scripts]
amadeus = "amadeus.main:main"
